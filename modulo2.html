<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrenamiento · Módulo 2 · Atención al cliente</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#1f2928;--muted:#64706d;--accent:#1f625d;--soft:#e7f0ee;--ok:#e7f4ea;--okb:#2f7041;--bad:#f7e9e7;--badb:#9a493f}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:820px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:18px}
h1{font-size:clamp(24px,4vw,36px);margin:0}.sub{color:var(--muted);margin:5px 0 0}.count{white-space:nowrap;color:var(--muted);font-weight:650}
.bar{height:8px;background:#ddd9d1;border-radius:99px;overflow:hidden;margin:18px 0}.bar>div{height:100%;background:var(--accent);width:0;transition:.25s}
.card{background:var(--card);border-radius:18px;padding:clamp(20px,4vw,34px);box-shadow:0 8px 28px #0000000c}
.q{font-size:clamp(19px,3vw,24px);line-height:1.35;font-weight:720;margin:0 0 22px}
.options{display:grid;gap:11px}.opt{width:100%;text-align:left;border:1.5px solid #d8d8d3;background:#fff;padding:15px 16px;border-radius:12px;font-size:16px;line-height:1.35;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--soft)}.opt:disabled{cursor:default;color:inherit}
.opt.correct{background:var(--ok);border-color:var(--okb)}.opt.wrong{background:var(--bad);border-color:var(--badb)}
.feedback{display:none;margin-top:18px;padding:15px 17px;border-radius:12px;line-height:1.45}.feedback.show{display:block}.feedback.ok{background:var(--ok)}.feedback.no{background:var(--bad)}
.actions{display:flex;justify-content:flex-end;margin-top:18px}.next,.restart{border:0;background:var(--accent);color:#fff;padding:12px 20px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
.next{display:none}.result{text-align:center;padding:10px 0}.score{font-size:52px;font-weight:800;color:var(--accent);margin:8px}.result p{color:var(--muted);font-size:18px;line-height:1.5}
.note{font-size:13px;color:var(--muted);margin-top:16px;text-align:center}
@media(max-width:560px){.top{align-items:start;flex-direction:column}.count{align-self:flex-end}}
</style>
</head>
<body><main class="wrap">
<div class="top"><div><h1>Entrenamiento · Módulo 2</h1><p class="sub">Comunicación efectiva y empatía</p></div><div class="count" id="count"></div></div>
<div class="bar"><div id="bar"></div></div>
<section class="card" id="card"></section>
<p class="note">Actividad de práctica. Puedes repetirla: el orden de las preguntas y de las respuestas cambia.</p>
</main>
<script>
const source = [{"q":"En una tienda ruidosa, un cliente no ha oído bien una condición y no es posible cambiar de lugar. ¿Qué conviene hacer?","opts":[["Repetir exactamente lo mismo con el mismo volumen",false,"Cuando no se puede reducir el ruido, conviene ajustar el volumen sin gritar, vocalizar, simplificar el mensaje y confirmar que la persona lo ha entendido. Esa alternativa no garantiza una comunicación clara."],["Hablar algo más alto sin gritar, vocalizar, usar palabras sencillas y comprobar que se ha entendido",true,"Cuando no se puede reducir el ruido, conviene ajustar el volumen sin gritar, vocalizar, simplificar el mensaje y confirmar que la persona lo ha entendido."],["Entregarle un folleto y continuar con la atención sin comprobar nada",false,"Cuando no se puede reducir el ruido, conviene ajustar el volumen sin gritar, vocalizar, simplificar el mensaje y confirmar que la persona lo ha entendido. Esa alternativa no garantiza una comunicación clara."],["Acercarse mucho y hablarle al oído para evitar el ruido",false,"Cuando no se puede reducir el ruido, conviene ajustar el volumen sin gritar, vocalizar, simplificar el mensaje y confirmar que la persona lo ha entendido. Esa alternativa no garantiza una comunicación clara."]]},{"q":"Una clienta responde «sí» a una explicación, pero luego plantea una duda que muestra otra interpretación. ¿Qué elemento permite detectar el malentendido?","opts":[["El canal",false,"La respuesta permite comprobar cómo se ha interpretado el mensaje y corregirlo. La opción «El canal» no es la más adecuada en esta situación."],["El código",false,"La respuesta permite comprobar cómo se ha interpretado el mensaje y corregirlo. La opción «El código» no es la más adecuada en esta situación."],["La respuesta o feedback",true,"La respuesta permite comprobar cómo se ha interpretado el mensaje y corregirlo."],["El saludo inicial",false,"La respuesta permite comprobar cómo se ha interpretado el mensaje y corregirlo. La opción «El saludo inicial» no es la más adecuada en esta situación."]]},{"q":"Un cliente dice «busco algo para un regalo». ¿Qué pregunta ayuda más a explorar antes de recomendar?","opts":[["¿Lo quiere en azul?",false,"Una pregunta abierta ayuda a conocer la necesidad antes de concretar opciones. La opción «¿Lo quiere en azul?» no es la más adecuada en esta situación."],["¿Qué tipo de regalo tiene en mente y para quién sería?",true,"Una pregunta abierta ayuda a conocer la necesidad antes de concretar opciones."],["¿Se lleva este modelo?",false,"Una pregunta abierta ayuda a conocer la necesidad antes de concretar opciones. La opción «¿Se lleva este modelo?» no es la más adecuada en esta situación."],["¿Tiene un presupuesto de exactamente 30 euros?",false,"Una pregunta abierta ayuda a conocer la necesidad antes de concretar opciones. La opción «¿Tiene un presupuesto de exactamente 30 euros?» no es la más adecuada en esta situación."]]},{"q":"Después de conocer el uso que dará a un producto, la profesional necesita saber si lo quiere para hoy. ¿Qué tipo de pregunta es «¿Lo necesita para hoy?»?","opts":[["Abierta",false,"Se responde con un dato breve o un sí o no; permite concretar un aspecto. La opción «Abierta» no es la más adecuada en esta situación."],["De alternativa",false,"Se responde con un dato breve o un sí o no; permite concretar un aspecto. La opción «De alternativa» no es la más adecuada en esta situación."],["Cerrada",true,"Se responde con un dato breve o un sí o no; permite concretar un aspecto."],["De reformulación",false,"Se responde con un dato breve o un sí o no; permite concretar un aspecto. La opción «De reformulación» no es la más adecuada en esta situación."]]},{"q":"Una persona ha explicado varias necesidades. ¿Cuál es la mejor forma de verificar que la has comprendido?","opts":[["Repetir literalmente todo lo que ha dicho",false,"Reformular los criterios esenciales y pedir confirmación permite corregir posibles errores. La opción «Repetir literalmente todo lo que ha dicho» no es la más adecuada en esta situación."],["«Busca algo sencillo, por menos de 30 euros y para hoy, ¿correcto?»",true,"Reformular los criterios esenciales y pedir confirmación permite corregir posibles errores."],["Presentar inmediatamente tres productos",false,"Reformular los criterios esenciales y pedir confirmación permite corregir posibles errores. La opción «Presentar inmediatamente tres productos» no es la más adecuada en esta situación."],["Preguntar si está segura de lo que quiere",false,"Reformular los criterios esenciales y pedir confirmación permite corregir posibles errores. La opción «Preguntar si está segura de lo que quiere» no es la más adecuada en esta situación."]]},{"q":"Un móvil tiene 256 GB y el cliente guarda muchas fotos. ¿Qué explicación resulta más útil?","opts":[["«Tiene 256 GB», sin más detalles",false,"Relacionar una característica con el beneficio que responde a esa necesidad hace útil la explicación. La opción ««Tiene 256 GB», sin más detalles» no es la más adecuada en esta situación."],["«Es nuestro modelo más popular»",false,"Relacionar una característica con el beneficio que responde a esa necesidad hace útil la explicación. La opción ««Es nuestro modelo más popular»» no es la más adecuada en esta situación."],["«Podrá guardar muchas fotos sin quedarse pronto sin espacio»",true,"Relacionar una característica con el beneficio que responde a esa necesidad hace útil la explicación."],["Enumerar todas las especificaciones técnicas",false,"Relacionar una característica con el beneficio que responde a esa necesidad hace útil la explicación. La opción «Enumerar todas las especificaciones técnicas» no es la más adecuada en esta situación."]]},{"q":"Una oferta tiene una condición que limita su aplicación. ¿Cómo se comunica profesionalmente?","opts":[["Explicar primero el beneficio y dejar la condición para después de cobrar",false,"La información correcta incluye límites y condiciones relevantes antes de la decisión. La opción «Explicar primero el beneficio y dejar la condición para después de cobrar» no es la más adecuada en esta situación."],["Omitirla si el cliente no pregunta",false,"La información correcta incluye límites y condiciones relevantes antes de la decisión. La opción «Omitirla si el cliente no pregunta» no es la más adecuada en esta situación."],["Explicar la ventaja y también la condición antes de que decida",true,"La información correcta incluye límites y condiciones relevantes antes de la decisión."],["Indicar que todas las ofertas tienen letra pequeña",false,"La información correcta incluye límites y condiciones relevantes antes de la decisión. La opción «Indicar que todas las ofertas tienen letra pequeña» no es la más adecuada en esta situación."]]},{"q":"No conoces la fecha en que llegará un producto. ¿Qué frase orienta mejor hacia una solución?","opts":[["«No sé cuándo llegará»",false,"Comprobar evita promesas sin fundamento y explica el siguiente paso. La opción ««No sé cuándo llegará»» no es la más adecuada en esta situación."],["«Vuelva otro día y pregunte»",false,"Comprobar evita promesas sin fundamento y explica el siguiente paso. La opción ««Vuelva otro día y pregunte»» no es la más adecuada en esta situación."],["«Voy a comprobar si tenemos una fecha prevista»",true,"Comprobar evita promesas sin fundamento y explica el siguiente paso."],["«Seguro que llega esta semana»",false,"Comprobar evita promesas sin fundamento y explica el siguiente paso. La opción ««Seguro que llega esta semana»» no es la más adecuada en esta situación."]]},{"q":"Una profesional dice «le escucho», mientras mira el móvil y se aparta. ¿Qué problema aparece?","opts":[["Exceso de información técnica",false,"La postura, la mirada y la atención deben ser coherentes con el mensaje verbal. La opción «Exceso de información técnica» no es la más adecuada en esta situación."],["Falta de coherencia entre palabras y conducta",true,"La postura, la mirada y la atención deben ser coherentes con el mensaje verbal."],["Pregunta demasiado abierta",false,"La postura, la mirada y la atención deben ser coherentes con el mensaje verbal. La opción «Pregunta demasiado abierta» no es la más adecuada en esta situación."],["Exceso de confianza",false,"La postura, la mirada y la atención deben ser coherentes con el mensaje verbal. La opción «Exceso de confianza» no es la más adecuada en esta situación."]]},{"q":"Durante una atención, una persona tarda en explicar su problema. ¿Qué conducta refleja escucha activa?","opts":[["Completar sus frases para ahorrar tiempo",false,"Escuchar antes de proponer evita anticipar una solución que quizá no encaje. La opción «Completar sus frases para ahorrar tiempo» no es la más adecuada en esta situación."],["Ofrecer enseguida la solución más habitual",false,"Escuchar antes de proponer evita anticipar una solución que quizá no encaje. La opción «Ofrecer enseguida la solución más habitual» no es la más adecuada en esta situación."],["Dejar que termine, observar y hacer preguntas útiles",true,"Escuchar antes de proponer evita anticipar una solución que quizá no encaje."],["Contar un caso parecido que te ocurrió",false,"Escuchar antes de proponer evita anticipar una solución que quizá no encaje. La opción «Contar un caso parecido que te ocurrió» no es la más adecuada en esta situación."]]},{"q":"Un cliente pregunta «¿cuál es el más barato?». ¿Cuál es la interpretación más prudente?","opts":[["Solo le importa el precio",false,"La petición no revela por sí sola toda la necesidad. Hay que preguntar sin etiquetar. La opción «Solo le importa el precio» no es la más adecuada en esta situación."],["No sabe usar productos complejos",false,"La petición no revela por sí sola toda la necesidad. Hay que preguntar sin etiquetar. La opción «No sabe usar productos complejos» no es la más adecuada en esta situación."],["Puede haber otras necesidades; conviene preguntar por el uso y los criterios",true,"La petición no revela por sí sola toda la necesidad. Hay que preguntar sin etiquetar."],["Quiere negociar un descuento",false,"La petición no revela por sí sola toda la necesidad. Hay que preguntar sin etiquetar. La opción «Quiere negociar un descuento» no es la más adecuada en esta situación."]]},{"q":"Una clienta se queja por una espera. ¿Cuál de estas respuestas valida y permite avanzar?","opts":[["«No es para tanto; hoy estamos ocupados»",false,"Validar la experiencia no obliga a dar la razón en todo; después se pasa a un paso concreto. La opción ««No es para tanto; hoy estamos ocupados»» no es la más adecuada en esta situación."],["«Entiendo que la espera le resulte molesta. Voy a comprobar cómo podemos atenderla»",true,"Validar la experiencia no obliga a dar la razón en todo; después se pasa a un paso concreto."],["«Tiene razón: siempre funcionamos mal»",false,"Validar la experiencia no obliga a dar la razón en todo; después se pasa a un paso concreto. La opción ««Tiene razón: siempre funcionamos mal»» no es la más adecuada en esta situación."],["«Cálmese y le explicaré las normas»",false,"Validar la experiencia no obliga a dar la razón en todo; después se pasa a un paso concreto. La opción ««Cálmese y le explicaré las normas»» no es la más adecuada en esta situación."]]},{"q":"Un cliente utiliza un tono elevado e insulta al personal. ¿Qué actuación es más adecuada?","opts":[["Responder con el mismo tono para marcar límites",false,"La empatía profesional permite mantener límites y pedir apoyo ante faltas de respeto. La opción «Responder con el mismo tono para marcar límites» no es la más adecuada en esta situación."],["Aceptarlo todo para mostrar empatía",false,"La empatía profesional permite mantener límites y pedir apoyo ante faltas de respeto. La opción «Aceptarlo todo para mostrar empatía» no es la más adecuada en esta situación."],["Mantener la calma, poner un límite respetuoso y pedir apoyo si procede",true,"La empatía profesional permite mantener límites y pedir apoyo ante faltas de respeto."],["Prometer una excepción para terminar la conversación",false,"La empatía profesional permite mantener límites y pedir apoyo ante faltas de respeto. La opción «Prometer una excepción para terminar la conversación» no es la más adecuada en esta situación."]]},{"q":"Una persona con diversidad funcional llega acompañada y pregunta por un producto. ¿A quién debes dirigirte primero?","opts":[["A su acompañante para facilitar la comunicación",false,"La atención inclusiva se dirige a la persona y evita suponer lo que necesita. La opción «A su acompañante para facilitar la comunicación» no es la más adecuada en esta situación."],["A la persona interesada y preguntar antes de ofrecer ayuda",true,"La atención inclusiva se dirige a la persona y evita suponer lo que necesita."],["A cualquiera, según quién hable más rápido",false,"La atención inclusiva se dirige a la persona y evita suponer lo que necesita. La opción «A cualquiera, según quién hable más rápido» no es la más adecuada en esta situación."],["A otra compañera para que se encargue",false,"La atención inclusiva se dirige a la persona y evita suponer lo que necesita. La opción «A otra compañera para que se encargue» no es la más adecuada en esta situación."]]},{"q":"Un cliente comunica que el precio cobrado no coincide con la etiqueta. ¿Cuál es el orden inicial más útil?","opts":[["Decir que el precio del sistema siempre prevalece",false,"El método de quejas combina escucha, reconocimiento y comprobación antes de resolver. La opción «Decir que el precio del sistema siempre prevalece» no es la más adecuada en esta situación."],["Escuchar lo sucedido, reconocer la molestia y comprobar ticket y etiqueta",true,"El método de quejas combina escucha, reconocimiento y comprobación antes de resolver."],["Ofrecer un descuento sin verificar nada",false,"El método de quejas combina escucha, reconocimiento y comprobación antes de resolver. La opción «Ofrecer un descuento sin verificar nada» no es la más adecuada en esta situación."],["Pedirle que presente directamente una reclamación",false,"El método de quejas combina escucha, reconocimiento y comprobación antes de resolver. La opción «Pedirle que presente directamente una reclamación» no es la más adecuada en esta situación."]]},{"q":"Tras revisar una queja, descubres que necesitas autorización para una devolución. ¿Qué haces?","opts":[["Garantizar la devolución para tranquilizar al cliente",false,"Derivar es profesional si se explica el paso y se conserva la información necesaria. La opción «Garantizar la devolución para tranquilizar al cliente» no es la más adecuada en esta situación."],["Explicar qué has comprobado y derivar a quien puede decidir, facilitando la continuidad",true,"Derivar es profesional si se explica el paso y se conserva la información necesaria."],["Decir que no es competencia tuya y terminar",false,"Derivar es profesional si se explica el paso y se conserva la información necesaria. La opción «Decir que no es competencia tuya y terminar» no es la más adecuada en esta situación."],["Pedirle que vuelva sin registrar la incidencia",false,"Derivar es profesional si se explica el paso y se conserva la información necesaria. La opción «Pedirle que vuelva sin registrar la incidencia» no es la más adecuada en esta situación."]]},{"q":"¿Qué cierre corresponde mejor al método de seis pasos ante una incidencia?","opts":[["Despedir en cuanto se anuncia la solución",false,"El cierre comprueba el resultado y deja constancia cuando procede. La opción «Despedir en cuanto se anuncia la solución» no es la más adecuada en esta situación."],["Confirmar que la opción queda clara, agradecer y registrar si hace falta",true,"El cierre comprueba el resultado y deja constancia cuando procede."],["Volver a explicar toda la normativa",false,"El cierre comprueba el resultado y deja constancia cuando procede. La opción «Volver a explicar toda la normativa» no es la más adecuada en esta situación."],["Pedir al cliente que no mencione la incidencia a otros",false,"El cierre comprueba el resultado y deja constancia cuando procede. La opción «Pedir al cliente que no mencione la incidencia a otros» no es la más adecuada en esta situación."]]},{"q":"En un relevo de turno queda una incidencia pendiente. ¿Qué información debe trasladarse?","opts":[["Solo el nombre del cliente",false,"Un relevo claro permite continuar la atención sin perder pasos ni difundir datos innecesarios. La opción «Solo el nombre del cliente» no es la más adecuada en esta situación."],["Lo ocurrido, lo hecho, lo pendiente, quién continúa y cuándo se revisa",true,"Un relevo claro permite continuar la atención sin perder pasos ni difundir datos innecesarios."],["Únicamente el error cometido por el turno anterior",false,"Un relevo claro permite continuar la atención sin perder pasos ni difundir datos innecesarios. La opción «Únicamente el error cometido por el turno anterior» no es la más adecuada en esta situación."],["Todo lo hablado, incluidos datos personales innecesarios",false,"Un relevo claro permite continuar la atención sin perder pasos ni difundir datos innecesarios. La opción «Todo lo hablado, incluidos datos personales innecesarios» no es la más adecuada en esta situación."]]},{"q":"Una compañera se equivoca delante de una clienta. ¿Qué forma de comunicación interna cuida mejor al equipo y al servicio?","opts":[["Corregirla públicamente para dejar claro el procedimiento",false,"Conviene hablar de hechos y corregir sin humillar delante de la clientela. La opción «Corregirla públicamente para dejar claro el procedimiento» no es la más adecuada en esta situación."],["Esperar a que la clienta se vaya y hablar de la conducta concreta con respeto",true,"Conviene hablar de hechos y corregir sin humillar delante de la clientela."],["Compartir el error con otros turnos para evitar que se repita",false,"Conviene hablar de hechos y corregir sin humillar delante de la clientela. La opción «Compartir el error con otros turnos para evitar que se repita» no es la más adecuada en esta situación."],["Evitar cualquier corrección aunque afecte a la atención",false,"Conviene hablar de hechos y corregir sin humillar delante de la clientela. La opción «Evitar cualquier corrección aunque afecte a la atención» no es la más adecuada en esta situación."]]},{"q":"Una persona pregunta algo que no puedes resolver en ese momento. ¿Qué respuesta reúne claridad, respeto y fiabilidad?","opts":[["«Eso no me toca»",false,"Una respuesta profesional reconoce el límite, comprueba y facilita un siguiente paso real. La opción ««Eso no me toca»» no es la más adecuada en esta situación."],["«No se preocupe, seguro que se arregla»",false,"Una respuesta profesional reconoce el límite, comprueba y facilita un siguiente paso real. La opción ««No se preocupe, seguro que se arregla»» no es la más adecuada en esta situación."],["«Voy a comprobarlo y le indicaré quién puede ayudarle y cuándo tendrá respuesta»",true,"Una respuesta profesional reconoce el límite, comprueba y facilita un siguiente paso real."],["«Consulte la web; allí lo explican todo»",false,"Una respuesta profesional reconoce el límite, comprueba y facilita un siguiente paso real. La opción ««Consulte la web; allí lo explican todo»» no es la más adecuada en esta situación."]]}];
let qs=[],i=0,score=0,answered=false;
const shuffle=a=>{a=[...a];for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function start(){qs=shuffle(source).map(x=>({...x,opts:shuffle(x.opts)}));i=0;score=0;render()}
function render(){
 answered=false;
 document.getElementById('count').textContent=`Pregunta ${i+1} de ${qs.length}`;
 document.getElementById('bar').style.width=`${i/qs.length*100}%`;
 const x=qs[i], card=document.getElementById('card');
 card.innerHTML=`<p class="q">${x.q}</p><div class="options">${x.opts.map((o,n)=>`<button class="opt" data-n="${n}"><b>${String.fromCharCode(65+n)}.</b> ${o[0]}</button>`).join('')}</div><div id="fb" class="feedback"></div><div class="actions"><button class="next" id="next">${i===qs.length-1?'Ver resultado':'Siguiente pregunta'}</button></div>`;
 card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
 document.getElementById('next').onclick=next;
}
function choose(n){
 if(answered)return; answered=true; const x=qs[i], chosen=x.opts[n], buttons=[...document.querySelectorAll('.opt')];
 buttons.forEach((b,j)=>{b.disabled=true;if(x.opts[j][1])b.classList.add('correct')});
 if(chosen[1])score++; else buttons[n].classList.add('wrong');
 const fb=document.getElementById('fb'); fb.className='feedback show '+(chosen[1]?'ok':'no');
 fb.innerHTML=`<strong>${chosen[1]?'Bien resuelto.':'Revisa esta idea.'}</strong><br>${chosen[2]}`;
 document.getElementById('next').style.display='block';
 document.getElementById('bar').style.width=`${(i+1)/qs.length*100}%`;
}
function next(){if(i<qs.length-1){i++;render()}else result()}
function result(){
 document.getElementById('count').textContent='Completado';
 document.getElementById('bar').style.width='100%';
 const pct=Math.round(score/qs.length*100);
 document.getElementById('card').innerHTML=`<div class="result"><div>Resultado</div><div class="score">${score}/${qs.length}</div><p>${pct}% de respuestas correctas.<br>La finalidad es practicar y aprender de los errores, no aprobar un examen.</p><button class="restart" onclick="start()">Volver a intentarlo</button></div>`;
}
start();
</script></body></html>
