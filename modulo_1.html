<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrenamiento · Módulo 1 · Atención al cliente</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#1f2928;--muted:#64706d;--accent:#1f625d;--soft:#e7f0ee;--ok:#e7f4ea;--okb:#2f7041;--bad:#f7e9e7;--badb:#9a493f}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:820px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:18px}
h1{font-size:clamp(24px,4vw,36px);margin:0}.sub{color:var(--muted);margin:5px 0 0}.count{white-space:nowrap;color:var(--muted);font-weight:650}
.bar{height:8px;background:#ddd9d1;border-radius:99px;overflow:hidden;margin:18px 0}.bar>div{height:100%;background:var(--accent);width:0;transition:.25s}
.card{background:var(--card);border-radius:18px;padding:clamp(20px,4vw,34px);box-shadow:0 8px 28px #0000000c}
.q{font-size:clamp(19px,3vw,24px);line-height:1.35;font-weight:720;margin:0 0 22px}
.options{display:grid;gap:11px}.opt{width:100%;text-align:left;border:1.5px solid #d8d8d3;background:#fff;padding:15px 16px;border-radius:12px;font-size:16px;line-height:1.35;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--soft)}.opt:disabled{cursor:default;color:inherit}
.opt.correct{background:var(--ok);border-color:var(--okb)}.opt.wrong{background:var(--bad);border-color:var(--badb)}
.feedback{display:none;margin-top:18px;padding:15px 17px;border-radius:12px;line-height:1.45}.feedback.show{display:block}.feedback.ok{background:var(--ok)}.feedback.no{background:var(--bad)}
.actions{display:flex;justify-content:flex-end;margin-top:18px}.next,.restart{border:0;background:var(--accent);color:#fff;padding:12px 20px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
.next{display:none}.result{text-align:center;padding:10px 0}.score{font-size:52px;font-weight:800;color:var(--accent);margin:8px}.result p{color:var(--muted);font-size:18px;line-height:1.5}
.note{font-size:13px;color:var(--muted);margin-top:16px;text-align:center}
@media(max-width:560px){.top{align-items:start;flex-direction:column}.count{align-self:flex-end}}
</style>
</head>
<body><main class="wrap">
<div class="top"><div><h1>Entrenamiento · Módulo 1</h1><p class="sub">Introducción a la atención al cliente</p></div><div class="count" id="count"></div></div>
<div class="bar"><div id="bar"></div></div>
<section class="card" id="card"></section>
<p class="note">Actividad de práctica. Puedes repetirla: el orden de las preguntas y de las respuestas cambia.</p>
</main>
<script>
const source = [{"q": "Una clienta entra en la tienda y parece estar buscando algo, pero todavía no ha pedido ayuda. ¿Qué actuación encaja mejor con una atención profesional?", "opts": [["Saludarla, mostrar disponibilidad y dejar espacio para que explique qué necesita", true, "La atención profesional comienza reconociendo a la persona y mostrando disponibilidad, sin invadir su espacio."], ["Esperar a que encuentre por sí sola lo que busca para no interferir", false, "Respetar el espacio no significa ignorar a la persona: conviene saludar y mostrar disponibilidad."], ["Empezar a explicarle los productos más vendidos para facilitarle la elección", false, "Antes de ofrecer productos es mejor detectar qué necesita la persona."], ["Preguntarle directamente qué producto va a comprar para agilizar la atención", false, "La pregunta presupone que ya ha decidido comprar; es preferible averiguar primero qué necesita."]]}, {"q": "En una tienda no existe un protocolo concreto sobre el tratamiento al cliente. ¿Qué criterio es el más adecuado al iniciar la conversación?", "opts": [["Empezar con un trato respetuoso y neutro y adaptarse después al contexto", true, "Un trato respetuoso y neutro evita asumir un nivel de confianza que todavía no existe. Después puede adaptarse al contexto y a cómo se dirige la persona a ti."], ["Usar un tono cercano desde el principio y pasar a uno formal si la persona lo solicita", false, "La cercanía puede ser adecuada en algunos comercios, pero sin protocolo la base propuesta es empezar de forma respetuosa y neutra."], ["Elegir entre tú y usted según la edad que aparente la persona", false, "La apariencia no permite saber qué tratamiento prefiere una persona. Es mejor observar, escuchar y adaptar el trato sin hacer suposiciones."], ["Mantener siempre el mismo tratamiento para todos los clientes durante toda la atención", false, "El tratamiento puede adaptarse a cómo habla la persona y al contexto del establecimiento."]]}, {"q": "Un cliente pregunta por una característica técnica de un producto y no conoces la respuesta con seguridad. ¿Qué deberías hacer?", "opts": [["Comprobar la información y volver con una respuesta clara", true, "Dar información no comprobada puede generar errores y desconfianza. Si no conoces la respuesta con seguridad, lo profesional es verificarla o pedir apoyo."], ["Dar la respuesta que parezca más probable y advertir que podría variar", false, "Aunque se advierta de la duda, se estaría dando información no comprobada."], ["Explicar únicamente lo que sí sabes y evitar volver sobre esa cuestión", false, "La atención profesional implica intentar resolver la duda, comprobando la información si es necesario."], ["Derivar inmediatamente al cliente sin hacer ninguna comprobación", false, "Puede ser necesario pedir apoyo o derivar, pero la responsabilidad es no dejar sola a la persona y facilitar la continuidad de la atención."]]}, {"q": "Una persona dice: «Solo estoy mirando». ¿Cuál de estas respuestas es más profesional?", "opts": [["«Perfecto. Si necesitas algo, estoy aquí.»", true, "Respeta la autonomía de la persona y, al mismo tiempo, mantiene disponible la ayuda."], ["«De acuerdo, cuando hayas decidido me avisas.»", false, "No es descortés, pero limita la ayuda al momento de la decisión. Es preferible dejar claro que sigues disponible en cualquier momento."], ["«Sin problema. Te enseño rápidamente las opciones principales.»", false, "La persona ha indicado que prefiere mirar; empezar a mostrar productos puede resultar invasivo."], ["«Perfecto. Entonces te dejo para que puedas mirar tranquilamente.»", false, "Respeta el espacio, pero no expresa de forma tan clara que sigues disponible para ayudar."]]}, {"q": "¿Qué diferencia describe mejor «orientar» frente a «informar»?", "opts": [["Orientar ayuda a comparar y elegir; informar aporta datos correctos sobre el producto o servicio", true, "Informar consiste en aportar datos correctos; orientar añade ayuda para comparar opciones y elegir la que mejor encaja con la necesidad."], ["Orientar consiste en recomendar una compra; informar consiste en explicar las condiciones de pago", false, "Informar abarca muchos datos útiles, no solo las condiciones de pago; orientar tampoco equivale simplemente a recomendar una compra."], ["Orientar se realiza antes de la compra e informar únicamente después", false, "Informar y orientar pueden aparecer en distintos momentos de la atención."], ["Orientar implica acompañar físicamente al cliente; informar puede hacerse desde cualquier lugar", false, "Orientar consiste en ayudar a comparar y elegir; no implica necesariamente acompañar físicamente a la persona."]]}, {"q": "Una clienta pregunta por ofertas, compara precios y quiere mantenerse dentro de un gasto concreto. ¿Qué pregunta sería especialmente útil?", "opts": [["«¿Tienes un presupuesto aproximado?»", true, "Preguntar por el presupuesto permite ofrecer alternativas ajustadas a lo que la persona está dispuesta a gastar."], ["«¿Qué es lo más importante para ti: duración o facilidad de uso?»", false, "Puede ser útil para comparar características, pero no aborda directamente la necesidad de ajustar la compra a un presupuesto."], ["«¿Para qué ocasión lo quieres?»", false, "Esta pregunta encaja mejor con una persona que busca inspiración o alternativas."], ["«¿Prefieres que lo hagamos juntas paso a paso?»", false, "Esta pregunta está orientada a personas que necesitan apoyo ante alguna barrera."]]}, {"q": "En una tienda de electrónica, ¿qué estilo de atención resulta más adecuado?", "opts": [["Saludo breve, información precisa y orientación directa", true, "En una compra técnica, la claridad y la precisión ayudan a comprender diferencias, características y compatibilidades sin añadir información irrelevante."], ["Conversación cercana, comentarios personales y recomendaciones emocionales", false, "Ese estilo no es el prioritario en un entorno técnico, donde se valora especialmente la precisión."], ["Explicación extensa de todas las posibilidades antes de preguntar qué busca", false, "Conviene detectar primero la necesidad y después ofrecer información relevante."], ["Trato muy formal, pausado y evitando preguntas directas", false, "Ese estilo se aproxima más al descrito para entornos de lujo o muy formales."]]}, {"q": "Durante una atención aparece una duda nueva que cambia lo que el cliente necesita. ¿Qué ocurre con el recorrido de atención?", "opts": [["Se puede volver a detectar necesidades y continuar desde ahí", true, "La atención no tiene por qué ser rígidamente lineal. Si aparece una necesidad nueva, conviene volver a aclararla antes de continuar."], ["Se mantiene el orden previsto y la duda se resuelve al final", false, "El recorrido no es rígido; puede ser necesario volver a una etapa anterior."], ["Se reinicia toda la atención desde la acogida", false, "No es necesario empezar de nuevo: basta con volver a detectar la necesidad que ha cambiado."], ["Se pasa directamente al cierre para evitar alargar la atención", false, "Si aparece una necesidad nueva, cerrar sin atenderla iría contra la orientación al cliente."]]}, {"q": "¿Cuál es el orden más adecuado para estructurar una atención completa?", "opts": [["Acogida → detección → información → acompañamiento → cierre → despedida", true, "Primero se acoge a la persona y se detecta qué necesita; después se informa y acompaña, y finalmente se cierra la atención y se despide."], ["Acogida → información → detección → acompañamiento → cierre → despedida", false, "Antes de informar conviene detectar qué necesita la persona."], ["Detección → acogida → información → acompañamiento → despedida → cierre", false, "La acogida abre la atención y la despedida se produce después del cierre."], ["Acogida → detección → acompañamiento → información → despedida → cierre", false, "El mapa sitúa la información antes del acompañamiento y el cierre antes de la despedida."]]}, {"q": "Un cliente te llama «cariño» varias veces y a ti te incomoda, pero no está siendo agresivo. ¿Qué estrategia permite mantener mejor un trato profesional sin aumentar el conflicto?", "opts": [["No devolver el apelativo y responder con neutralidad mediante una pregunta útil", true, "No devolver el apelativo y continuar con una pregunta útil permite mantener un tono profesional sin reforzar una familiaridad que te incomoda."], ["Pedirle inmediatamente que deje de utilizar cualquier expresión familiar", false, "Poner un límite explícito puede ser necesario si la situación continúa o aumenta, pero inicialmente puede bastar con no reforzar el apelativo y mantener un trato neutro."], ["Responder con otro apelativo amable para mantener una relación cordial", false, "Responder con otro apelativo puede reforzar precisamente el nivel de familiaridad que te resulta incómodo."], ["Pasar automáticamente al tratamiento de usted para señalar distancia", false, "El tratamiento depende del contexto y del protocolo; la estrategia principal propuesta es responder con neutralidad."]]}, {"q": "¿Cuál de estas situaciones forma parte de la experiencia de compra «después» de la compra?", "opts": [["La gestión de un cambio o una devolución", true, "Los cambios y devoluciones se producen después de la compra y también forman parte de la experiencia que el cliente tendrá con el establecimiento."], ["La señalización y la información visible de precios", false, "Estos elementos forman parte de la experiencia previa a la interacción de compra."], ["La disponibilidad del personal mientras el cliente decide", false, "La disponibilidad durante la decisión pertenece a la experiencia durante la compra."], ["La comparación de dos productos antes de elegir", false, "La comparación se produce durante el proceso de atención y decisión."]]}, {"q": "Una persona tiene dificultades para utilizar una pantalla de autoservicio. ¿Qué actuación es más adecuada?", "opts": [["Explicar los pasos con paciencia y comprobar que los ha entendido", true, "Explicar por pasos y comprobar la comprensión permite ayudar sin convertir a la persona en una espectadora de la operación."], ["Realizar toda la operación por ella para evitarle dificultades", false, "Resolverlo todo sin explicar soluciona el momento, pero no permite que la persona comprenda el proceso ni participe en él."], ["Explicarle primero todas las funciones de la pantalla y después dejarla probar", false, "Explicar todas las funciones de una vez puede sobrecargar con información innecesaria. Es más útil avanzar paso a paso según lo que necesite."], ["Darle instrucciones breves y dejar que continúe sola para respetar su autonomía", false, "La autonomía es importante, pero cuando existe una barrera conviene acompañar y comprobar la comprensión."]]}, {"q": "Una compañera dice: «Mi tarea es caja; si alguien pregunta por almacén, no es responsabilidad mía». ¿Qué principio profesional contradice esta idea?", "opts": [["Aunque no sea tu tarea, debes facilitar la atención y derivar a la persona adecuadamente", true, "Que una consulta corresponda a otra función no elimina la responsabilidad de facilitar la atención: puedes acompañar o indicar claramente quién puede resolverla."], ["Todo el personal debe saber realizar todas las tareas de la tienda", false, "Facilitar la atención no exige dominar todas las funciones; también es profesional saber cuándo y a quién derivar."], ["La persona de caja también debe asumir siempre las tareas de almacén", false, "Facilitar o derivar no significa asumir necesariamente la tarea de otro puesto."], ["Las funciones internas deben explicarse al cliente para que sepa a quién dirigirse", false, "El principio destacado es facilitar la continuidad de la atención, no trasladar al cliente la organización interna."]]}, {"q": "¿Qué significa realmente «imagen profesional»?", "opts": [["Higiene, adecuación al puesto, seguridad y respeto a las normas", true, "La imagen profesional no depende de la belleza ni de un estilo único, sino de la higiene, la adecuación al puesto, la seguridad y el cumplimiento de las normas."], ["Mantener una apariencia formal y homogénea en cualquier tipo de comercio", false, "La adecuación depende del puesto y del protocolo; no se exige un estilo formal único."], ["Vestir de acuerdo con la imagen que espera la mayoría de los clientes", false, "La profesionalidad no debería depender de ajustarse a expectativas estéticas de la clientela, sino de criterios relacionados con el puesto y sus normas."], ["Destacar una imagen personal cuidada aunque no exista un protocolo específico", false, "La imagen profesional se define por higiene, adecuación, seguridad y normas, no por destacar un estilo personal."]]}, {"q": "Una persona mira etiquetas, pregunta por composición, garantía y diferencias entre modelos. ¿Cómo conviene adaptar la atención?", "opts": [["Dar información exacta y comparar dos o tres opciones relevantes", true, "Preguntar por composición, garantía y diferencias muestra interés por datos concretos. Comparar unas pocas opciones relevantes facilita una decisión informada."], ["Mostrarle variedad y dejar que descubra las diferencias por sí misma", false, "La variedad puede ayudar a quien explora, pero aquí la persona está pidiendo datos concretos y comparaciones."], ["Resumir la información al mínimo para que pueda decidir con rapidez", false, "No hay señales de que la prioridad sea la rapidez; sí las hay de que busca información detallada."], ["Preguntarle primero cuánto quiere gastar y ordenar las opciones por precio", false, "El presupuesto puede ser relevante, pero las señales descritas apuntan principalmente a una necesidad de información técnica y comparación."]]}, {"q": "¿Cuál de estas conductas refleja mejor «acompañar sin invadir»?", "opts": [["Ofrecer ayuda y opciones, respetando el espacio y el ritmo de la persona", true, "Acompañar significa facilitar el proceso manteniéndose disponible, pero respetando el espacio y el ritmo de la persona."], ["Permanecer cerca durante toda la compra para estar disponible inmediatamente", false, "La disponibilidad es positiva, pero permanecer cerca constantemente puede invadir el espacio de quien prefiere autonomía."], ["Explicar todas las alternativas para que la persona disponga de la máxima información", false, "Dar demasiada información sin detectar la necesidad puede dificultar en lugar de facilitar."], ["Esperar a que la persona solicite expresamente cualquier tipo de ayuda", false, "La atención profesional también implica observar y mostrar disponibilidad, no solo reaccionar cuando se solicita ayuda."]]}, {"q": "Hay cola y estás atendiendo a otra persona. Una nueva clienta espera delante del mostrador. ¿Qué respuesta gestiona mejor la situación?", "opts": [["Reconocer su presencia y avisarle de que la atenderás en cuanto termines", true, "Reconocer a quien espera evita que se sienta ignorado y permite gestionar la espera con amabilidad sin abandonar a la persona que estás atendiendo."], ["Terminar con la primera persona antes de dirigirte a la siguiente para no interrumpir la atención", false, "Aunque no debes abandonar la atención actual, puedes reconocer brevemente a quien espera para que sepa que la has visto."], ["Pedirle que espere su turno sin iniciar ninguna otra interacción", false, "Gestionar la cola requiere eficiencia, pero también amabilidad y reconocimiento de la persona."], ["Preguntarle qué necesita mientras continúas atendiendo a la primera persona", false, "Eso puede dividir la atención; basta con reconocerla y comunicar que será atendida en cuanto sea posible."]]}, {"q": "¿Cuál de estas acciones pertenece principalmente a la detección de necesidades?", "opts": [["Observar y hacer una pregunta abierta antes de proponer una solución", true, "Observar y preguntar permite descubrir la necesidad real antes de ofrecer información o soluciones basadas en suposiciones."], ["Explicar con claridad las condiciones y características de un producto", false, "Eso corresponde principalmente a la etapa de información."], ["Confirmar qué producto se lleva la persona y si queda alguna duda", false, "Esa actuación corresponde al cierre."], ["Proponer alternativas y facilitar la decisión sin presionar", false, "Eso corresponde principalmente al acompañamiento."]]}, {"q": "¿Qué afirmación describe mejor el uso profesional de las tipologías de clientela?", "opts": [["Son necesidades observables que pueden mezclarse y cambiar según el momento", true, "Las necesidades de una persona pueden mezclarse y cambiar durante la compra; por eso no conviene convertirlas en etiquetas fijas."], ["Son perfiles útiles para identificar rápidamente cómo es cada persona", false, "Clasificar a una persona de forma fija puede llevar a suposiciones y dificultar la adaptación cuando sus necesidades cambian."], ["Permiten anticipar la forma de atender según las primeras señales del cliente", false, "Las señales ayudan a orientar la atención, pero la regla es observar, preguntar y adaptar, no anticipar mediante suposiciones."], ["Cada cliente suele encajar en un perfil principal que guía toda la atención", false, "Una misma persona puede mostrar varias necesidades a la vez o cambiar durante la atención."]]}, {"q": "¿Cuál de estas situaciones muestra mejor una venta entendida de forma profesional según el módulo?", "opts": [["Proponer una opción útil que encaja con la necesidad detectada, sin presionar", true, "Una venta profesional relaciona la propuesta con una necesidad real y permite que la persona decida sin presión."], ["Presentar primero los productos con mayor margen y dejar que el cliente decida", false, "Priorizar el margen comercial puede desplazar la necesidad del cliente; la propuesta debería ser útil y adecuada a lo que busca."], ["Explicar todas las promociones disponibles para aumentar las posibilidades de compra", false, "Las promociones deben explicarse con claridad cuando sean relevantes, pero no sustituyen la detección de necesidades."], ["Intentar cerrar la compra cuando la persona ya ha mostrado interés suficiente", false, "Mostrar interés no basta: la venta profesional se basa en una propuesta útil y sin presión."]]}];
let qs=[],i=0,score=0,answered=false;
const shuffle=a=>{a=[...a];for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function start(){qs=shuffle(source).map(x=>({...x,opts:shuffle(x.opts)}));i=0;score=0;render()}
function render(){
 answered=false;
 document.getElementById('count').textContent=`Pregunta ${i+1} de ${qs.length}`;
 document.getElementById('bar').style.width=`${i/qs.length*100}%`;
 const x=qs[i], card=document.getElementById('card');
 card.innerHTML=`<p class="q">${x.q}</p><div class="options">${x.opts.map((o,n)=>`<button class="opt" data-n="${n}"><b>${String.fromCharCode(65+n)}.</b> ${o[0]}</button>`).join('')}</div><div id="fb" class="feedback"></div><div class="actions"><button class="next" id="next">${i===qs.length-1?'Ver resultado':'Siguiente pregunta'}</button></div>`;
 card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
 document.getElementById('next').onclick=next;
}
function choose(n){
 if(answered)return; answered=true; const x=qs[i], chosen=x.opts[n], buttons=[...document.querySelectorAll('.opt')];
 buttons.forEach((b,j)=>{b.disabled=true;if(x.opts[j][1])b.classList.add('correct')});
 if(chosen[1])score++; else buttons[n].classList.add('wrong');
 const fb=document.getElementById('fb'); fb.className='feedback show '+(chosen[1]?'ok':'no');
 fb.innerHTML=`<strong>${chosen[1]?'Bien resuelto.':'Revisa esta idea.'}</strong><br>${chosen[2]}`;
 document.getElementById('next').style.display='block';
 document.getElementById('bar').style.width=`${(i+1)/qs.length*100}%`;
}
function next(){if(i<qs.length-1){i++;render()}else result()}
function result(){
 document.getElementById('count').textContent='Completado';
 document.getElementById('bar').style.width='100%';
 const pct=Math.round(score/qs.length*100);
 document.getElementById('card').innerHTML=`<div class="result"><div>Resultado</div><div class="score">${score}/${qs.length}</div><p>${pct}% de respuestas correctas.<br>La finalidad es practicar y aprender de los errores, no aprobar un examen.</p><button class="restart" onclick="start()">Volver a intentarlo</button></div>`;
}
start();
</script></body></html>
